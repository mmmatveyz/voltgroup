services:
  - type: web
    name: voltgroup-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k gthread --threads 8 --bind 0.0.0.0:$PORT --access-logfile - server:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: SHEET_URL
        sync: false
      - key: GOOGLE_CREDENTIALS
        sync: false
      - key: TELEGRAM_SECRET_TOKEN
        sync: false
