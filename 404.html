<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена | VoltGroup</title>
    <!-- Иконка для браузеров и поиска -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <link rel="manifest" href="/manifest.json">

    <style>
        :root {
            --bg-dark: #050914;
            --primary: #00E5FF;
            --primary-glow: rgba(0, 229, 255, 0.4);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1a2c4e 0%, var(--bg-dark) 60%);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px var(--primary);
            margin-bottom: 20px;
            line-height: 1;
            text-shadow: 0 0 30px var(--primary-glow);
        }

        h1 { font-size: 2rem; margin-bottom: 15px; color: var(--text-main); }
        p { color: var(--text-muted); font-size: 1.1rem; max-width: 500px; margin-bottom: 30px; }

        .home-btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 14px 32px; border-radius: 50px; font-weight: 600; font-size: 1rem;
            cursor: pointer; border: none; transition: var(--transition);
            background: var(--primary); color: #000;
            box-shadow: 0 0 20px var(--primary-glow);
            text-decoration: none;
        }
        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px var(--primary-glow);
            background: #fff;
        }

        .spark-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="spark-icon">⚡</div>
<div class="error-code">404</div>
<h1>Страница не найдена</h1>
<p>Похоже, эта страница ушла в отпуск или была удалена. Но электричество здесь всё ещё есть!</p>

<a href="./index.html" class="home-btn">Вернуться на главную</a>
</body>
</html>
